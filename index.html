<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b36"><title>StudyStack v6 — Flashcards</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0ff;background:#0b1225}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 0,#203967 0,transparent 36%),#0b1225}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.shell{max-width:1100px;margin:auto;padding:24px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap}.logo{font-weight:850;font-size:24px;letter-spacing:-.8px}.logo span{color:#79a9ff}.muted{color:#a5b4d0}.small{font-size:13px}.btn{border:1px solid #405277;background:#23355a;color:#f2f6ff;border-radius:12px;padding:11px 15px;font-weight:700}.btn:hover{background:#314976}.btn.primary{background:#6698ff;color:#09142d;border-color:#6698ff}.btn.primary:hover{background:#8bb1ff}.btn.danger{border-color:#82475a;color:#ffb4c4;background:#382436}.btn.ghost{background:transparent}.btn.good{background:#1b6d5a;border-color:#2cae8d}.btn.bad{background:#69384e;border-color:#c76c89}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.panel{background:#151f37;border:1px solid #30405f;border-radius:20px;padding:22px;box-shadow:0 14px 40px #03071422}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.deck{display:flex;flex-direction:column;gap:10px;min-height:170px;text-align:left}.deck strong{font-size:19px}.deck .foot{margin-top:auto}.pill{display:inline-block;background:#293d64;border-radius:99px;padding:5px 10px;color:#bcd0f7;font-size:12px;font-weight:750}h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1px;margin:0 0 8px}h2{font-size:22px;margin:0 0 12px}p{line-height:1.55}input,textarea,select{width:100%;border:1px solid #435474;border-radius:12px;padding:12px;background:#0d172b;color:white}textarea{min-height:100px;resize:vertical}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#101b32;border:1px solid #2e4062;padding:16px;border-radius:14px;text-align:center}.stat b{display:block;font-size:27px}.stat span{color:#a8b9d6;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab.active{background:#668fff;color:#07142b}.card{min-height:285px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:35px;cursor:pointer;background:linear-gradient(145deg,#1d3255,#14223d);border:1px solid #58729f;border-radius:22px;user-select:none}.card h2{font-size:clamp(23px,4vw,32px);line-height:1.4;overflow-wrap:anywhere}.card .hint{color:#9db4d7;font-size:13px;margin-top:15px}.study{max-width:760px;margin:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions .btn{padding:16px}.list{display:grid;gap:10px}.item{background:#101b32;border:1px solid #30415e;border-radius:13px;padding:14px}.item strong{display:block;margin-bottom:6px}.item .answer{color:#b6c7e3}.hidden{display:none!important}.note{border-left:3px solid #729cff;padding:10px 14px;background:#1a2b49;border-radius:8px}.progress{height:9px;background:#2c3b5b;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#48c6a1;transition:width .2s}.upload{border:2px dashed #4b6692;border-radius:15px;padding:20px;text-align:center}.empty{text-align:center;padding:45px 20px}.divider{border:0;border-top:1px solid #34425e;margin:20px 0}.footnote{margin-top:35px;text-align:center;color:#8295b7;font-size:12px}.wide{width:100%}code{background:#101b32;padding:2px 5px;border-radius:5px}a{color:#a9c7ff}.quizOpt{width:100%;display:block;text-align:left;margin:8px 0}.quizOpt.correct{border-color:#46caa0;background:#174c42}.quizOpt.wrong{border-color:#e47c96;background:#552d40}@media(max-width:600px){.shell{padding:16px 12px 55px}.panel{padding:16px}.stats{gap:6px}.stat{padding:12px 5px}.card{min-height:265px;padding:20px}}
</style></head><body><div class="shell"><header><div class="logo">📚 Study<span>Stack</span> <small style="font-size:12px;color:#a8c6ff;vertical-align:middle">v8.0 · Auto Shared Decks</small></div><div class="row"><button class="btn ghost" id="homeBtn">My decks</button><button class="btn primary" id="newBtn">+ New deck</button></div></header><main id="app"></main><div class="footnote">Your study progress is saved in this browser. No account, installation, or subscription required.</div></div><script>
(()=>{'use strict';const KEY='studystack-v1',app=document.getElementById('app');let db;try{db=JSON.parse(localStorage.getItem(KEY))||{decks:[]}}catch{db={decks:[]}};if(!Array.isArray(db.decks))db={decks:[]};let current=null,mode='home',filter='unknown',idx=0,flip=false,shuffle=false,quizIndex=0,quizAnswered=false,learningTaps=0,learningMode=false;const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Browser storage is full or unavailable. Export your deck to preserve it.')}};const deck=()=>db.decks.find(x=>x.id===current);const makeDeck=(name,cards=[])=>({id:uid(),name:name||'Untitled deck',cards:cards.map(c=>({id:uid(),q:String(c.q||c.front||''),a:String(c.a||c.back||''),known:false})),created:Date.now()});const stats=d=>({total:d.cards.length,known:d.cards.filter(c=>c.known).length,unknown:d.cards.filter(c=>!c.known).length});const btn=(label,fn,cls='')=>`<button class="btn ${cls}" data-act="${fn}">${label}</button>`;const set=(html)=>app.innerHTML=html;const head=d=>`<div class="row space"><div><h1>${esc(d.name)}</h1><span class="muted small">${d.cards.length} cards in master deck</span></div>${btn('← All decks','home','ghost')}</div>`;function home(){mode='home';current=null;set(`<div class="row space"><div><h1>Your study decks</h1><p class="muted">Learn it. Mark it. Master it. Shared decks load automatically.</p></div>${btn('Import deck','import')} ${btn('Refresh shared decks','refreshShared')}</div>${db.decks.length?`<div class="grid">${db.decks.slice().sort((a,b)=>Number(!!b.sharedFile)-Number(!!a.sharedFile)).map(d=>{let s=stats(d);return `<button class="panel deck" data-open="${esc(d.id)}"><span class="pill">${d.sharedFile?'🌐 Shared deck · ':'My deck · '}${s.total} flashcards</span><strong>${esc(d.name)}</strong><div class="progress"><div style="width:${s.total?100*s.known/s.total:0}%"></div></div><div class="muted small foot">${s.known} known · ${s.unknown} to review</div></button>`}).join('')}</div>`:`<div class="panel empty"><h2>No decks yet</h2><p class="muted">Create your first deck or import flashcards made with ChatGPT.</p>${btn('Create a deck','new','primary')} ${btn('Import a deck','import')}</div>`}<div class="panel" style="margin-top:18px"><h2>Made study cards in ChatGPT?</h2><p class="muted">Ask ChatGPT to turn your study guide photos into a JSON flashcard deck. Import that JSON here, then share the deck as a standalone HTML file.</p>${btn('Copy ChatGPT prompt','prompt')}</div>`)}function open(id){current=id;mode='deck';filter='unknown';idx=0;flip=false;learningTaps=0;learningMode=false;renderDeck()}function renderDeck(){let d=deck();if(!d)return home();let s=stats(d);set(`${head(d)}<div class="stats"><div class="stat"><b>${s.total}</b><span>All cards</span></div><div class="stat"><b style="color:#53d4ad">${s.known}</b><span>Know it</span></div><div class="stat"><b>${s.unknown}</b><span>Don't know yet</span></div></div><div class="progress"><div style="width:${s.total?100*s.known/s.total:0}%"></div></div><div class="tabs">${btn('Study cards','study','primary')} ${btn('Multiple-choice quiz','quiz')} ${btn('View / edit cards','edit')} ${btn('Share / export','export')}</div><div class="panel"><h2>Study settings</h2><label for="filter">Cards to include</label><select id="filter"><option value="unknown">Only cards I don't know</option><option value="all">Include all cards</option><option value="known">Only cards I know</option></select><label><input id="shuffle" type="checkbox" style="width:auto" ${shuffle?'checked':''}> Shuffle cards</label><p class="muted small">Flip first to unlock ratings. “Don’t Know It” starts 3 Learn It practice rounds. Known cards stay in the master deck.</p>${btn('Start studying','study','primary')} ${btn('Reset all to Don’t know','reset','ghost')}</div>`);document.getElementById('filter').value=filter;document.getElementById('filter').onchange=e=>filter=e.target.value;document.getElementById('shuffle').onchange=e=>shuffle=e.target.checked}let order=[];function pool(){let d=deck();return order.filter(id=>d.cards.some(c=>c.id===id&&(filter==='all'||filter==='known'&&c.known||filter==='unknown'&&!c.known)))}function begin(type){let d=deck();if(!d)return;mode=type;idx=0;flip=false;learningTaps=0;learningMode=false;quizIndex=0;quizAnswered=false;order=d.cards.map(c=>c.id);if(shuffle)order.sort(()=>Math.random()-.5);type==='quiz'?renderQuiz():renderStudy()}function renderStudy(){let d=deck();if(!d)return home();if(!order.length)order=d.cards.map(c=>c.id);let p=pool(),s=stats(d);if(!p.length){set(`${head(d)}<div class="panel empty"><h2>🎉 No cards in this stack!</h2><p class="muted">All ${s.total} cards remain in your master deck.</p>${btn('Include all cards','all','primary')} ${btn('Back to deck','deck')}</div>`);return}idx=Math.min(idx,p.length-1);let c=d.cards.find(c=>c.id===p[idx]);let remain=3-learningTaps;let guidance=learningMode?(flip?`Answer revealed! Tap “Flip to question” to continue. ${remain} practice ${remain===1?'round':'rounds'} left.`:`Learn it ${remain}× — recall the answer first, then tap this button to reveal it.`):(!flip?'Both rating buttons unlock when you reveal the answer. Tap the card to flip.':'Answer revealed. Select Know It to master this card, or Don’t Know It to start 3 practice rounds.');let noLabel=learningMode?(flip?'↻ Flip to question':`📚 Learn it ${remain}×`):'✕ Don’t Know It';set(`${head(d)}<div class="study"><div class="row space" style="margin:18px 0"><span class="pill">${idx+1} of ${p.length} in this stack</span><span class="pill">${s.known} / ${s.total} mastered</span></div><div class="card" id="flipCard" role="button" tabindex="0" aria-label="Flip flashcard"><span class="pill">${flip?'ANSWER':'QUESTION'}</span><h2>${esc(flip?c.a:c.q)}</h2><span class="hint">${learningMode?'Use Learn It / Flip button below':'Tap card to flip ↻'}</span></div><div class="panel" role="status" aria-live="polite" style="margin:12px 0;padding:14px;text-align:center;border:1px solid #6b91e8"><strong style="color:#a8c6ff">${learningMode?`📚 Learn it! ${remain}× remaining`:'Flip the card to begin · v7'}</strong><p style="margin:8px 0 0" class="muted small">${guidance}</p>${learningMode?`<div style="display:flex;gap:6px;margin-top:10px">${[1,2,3].map(n=>`<span style="flex:1;height:6px;border-radius:9px;background:${n<=learningTaps?'#6da6ff':'#34415f'}"></span>`).join('')}</div>`:''}</div><div class="actions"><button class="btn bad" data-act="no" ${!flip&&!learningMode?'disabled aria-disabled="true" title="Reveal the answer first"':''}>${noLabel}</button><button class="btn good" data-act="yes" ${!flip?'disabled aria-disabled="true" title="Reveal the answer first"':''}>✓ Know It</button></div><div class="row space" style="margin-top:12px">${btn('← Previous','prev','ghost')}${btn('Skip →','next','ghost')}</div><hr class="divider"><div class="row">${btn('Change stack','deck')}${btn('Include all','all')}${btn('Only don’t know','unknown')}</div></div>`);let el=document.getElementById('flipCard');el.onclick=()=>{if(learningMode)return;flip=!flip;renderStudy()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(learningMode)return;flip=!flip;renderStudy()}}}
function rate(known){let p=pool();if(!p.length)return;let cardId=p[idx],c=deck().cards.find(c=>c.id===cardId);if(!c)return;if(known){if(!flip)return;c.known=true;save();advance(cardId,true);return}if(!learningMode){if(!flip)return;learningMode=true;learningTaps=0;flip=false;renderStudy();return}if(!flip){flip=true;renderStudy();return}flip=false;learningTaps++;if(learningTaps<3){renderStudy();return}c.known=false;save();advance(cardId,false)}
function advance(cardId,known){flip=false;learningTaps=0;learningMode=false;if(!known){order=order.filter(id=>id!==cardId);order.push(cardId);let next=pool();idx=next.length>1?(idx>=next.length-1?0:idx):0}else{let next=pool();if(!next.length){idx=0;renderStudy();return}idx=filter==='all'?(idx+1)%next.length:idx%next.length}renderStudy()}
function renderQuiz(){let d=deck(),p=pool();if(p.length<1){set(`${head(d)}<div class="panel empty"><h2>No cards in this stack</h2>${btn('Include all','all')}</div>`);return}quizIndex=Math.min(quizIndex,p.length-1);let c=d.cards.find(x=>x.id===p[quizIndex]);let distract=d.cards.filter(x=>x.id!==c.id&&x.a.trim().toLowerCase()!==c.a.trim().toLowerCase()).sort(()=>Math.random()-.5).slice(0,3);let opts=[c,...distract].sort(()=>Math.random()-.5);set(`${head(d)}<div class="study panel" style="margin-top:20px"><span class="pill">Quiz question ${quizIndex+1} of ${p.length}</span><h2 style="margin:25px 0">${esc(c.q)}</h2>${opts.length<2?`<p class="note">Add more cards for multiple-choice questions.</p><div class="card" id="flipCard"><h2>${esc(quizAnswered?c.a:'Tap to reveal answer')}</h2></div>`:opts.map(o=>`<button class="btn quizOpt" data-choice="${esc(o.id)}">${esc(o.a)}</button>`).join('')}<p id="feedback" class="muted"></p><div class="row">${btn('Know it','qyes','good')}${btn('Don’t know','qno','bad')}${btn('Next →','qnext')}</div><p class="muted small">Use Know it / Don't know to update your study stack.</p></div>`);let el=document.getElementById('flipCard');if(el)el.onclick=()=>{quizAnswered=true;renderQuiz()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(quizAnswered)return;quizAnswered=true;document.querySelectorAll('[data-choice]').forEach(x=>{x.disabled=true;if(x.dataset.choice===c.id)x.classList.add('correct');else if(x===b)x.classList.add('wrong')});document.getElementById('feedback').textContent=b.dataset.choice===c.id?'Correct!':'Not quite — the correct answer is highlighted.'})}function edit(){mode='edit';let d=deck();set(`${head(d)}<div class="row space" style="margin:18px 0"><h2>Master card list</h2>${btn('+ Add card','add','primary')}</div><div class="list">${d.cards.map((c,i)=>`<div class="item"><div class="row space"><span class="pill">Card ${i+1} · ${c.known?'✓ Known':'Needs review'}</span><div>${btn('Edit','modify:'+c.id)} ${btn('Delete','delete:'+c.id,'danger')}</div></div><strong>${esc(c.q)}</strong><div class="answer">${esc(c.a)}</div></div>`).join('')||'<p>No cards yet.</p>'}</div><div class="row" style="margin-top:20px">${btn('Back to deck','deck')}${btn('Import more cards','importMore')}</div>`)}function cardForm(id){let d=deck(),c=id?d.cards.find(x=>x.id===id):null;mode='form';set(`${head(d)}<div class="panel" style="max-width:700px;margin:20px auto"><h2>${c?'Edit':'Add'} flashcard</h2><form id="cardForm"><label>Question / front</label><textarea id="question" required>${esc(c?.q||'')}</textarea><label>Answer / back</label><textarea id="answer" required>${esc(c?.a||'')}</textarea><div class="row" style="margin-top:16px"><button class="btn primary" type="submit">Save card</button>${btn('Cancel','edit')}</div></form></div>`);document.getElementById('cardForm').onsubmit=e=>{e.preventDefault();let q=document.getElementById('question').value.trim(),a=document.getElementById('answer').value.trim();if(!q||!a)return;if(c){c.q=q;c.a=a}else d.cards.push({id:uid(),q,a,known:false});save();edit()}}function newDeck(){mode='new';set(`<div class="panel" style="max-width:650px;margin:auto"><h1>Create a deck</h1><form id="newForm"><label>Study guide or subject name</label><input id="deckName" required placeholder="e.g. Biology Chapter 4"><p class="muted small">Add cards manually, or import a ChatGPT-generated deck.</p><button class="btn primary" type="submit">Create deck</button></form></div>`);document.getElementById('newForm').onsubmit=e=>{e.preventDefault();let d=makeDeck(document.getElementById('deckName').value.trim());db.decks.push(d);save();open(d.id)}}function normalize(raw){let o=raw;if(typeof o==='string')o=JSON.parse(o);let cards=Array.isArray(o)?o:o.cards||o.flashcards||o.questions;if(!Array.isArray(cards))throw Error('JSON must contain a cards array.');let result=cards.map(c=>({q:String(c.q??c.front??c.question??'').trim(),a:String(c.a??c.back??c.answer??'').trim()})).filter(c=>c.q&&c.a);if(!result.length)throw Error('No valid question/answer pairs found.');return {name:(!Array.isArray(o)&&String(o.title||o.name||''))||'Imported study guide',cards:result}}function importScreen(more=false){mode='import';set(`<h1>${more?'Add cards to this deck':'Import flashcards'}</h1><div class="panel" style="max-width:760px"><p class="muted">Paste ChatGPT flashcard JSON, or select a saved JSON file. The app works offline after importing.</p><label>Choose JSON file</label><input type="file" id="jsonFile" accept=".json,application/json,.txt"><label>Or paste JSON</label><textarea id="jsonText" style="min-height:220px" placeholder='{"title":"Science","cards":[{"front":"What is an atom?","back":"The basic unit of an element."}]}'></textarea><div class="row" style="margin-top:15px">${btn('Import cards','doImport','primary')}${btn('Copy ChatGPT prompt','prompt')}${btn('Cancel',more?'deck':'home')}</div><p id="importError" style="color:#ff9daf"></p></div>`);document.getElementById('jsonFile').onchange=async e=>{let f=e.target.files[0];if(f)document.getElementById('jsonText').value=await f.text()};window.importMore=more}function doImport(){try{let n=normalize(document.getElementById('jsonText').value);if(window.importMore&&deck()){deck().cards.push(...n.cards.map(c=>({...c,id:uid(),known:false})));save();edit()}else{let d=makeDeck(n.name,n.cards);db.decks.push(d);save();open(d.id)}}catch(e){document.getElementById('importError').textContent=e.message}}const prompt=`I am uploading photos of a study guide. Read ALL legible content from every image and create comprehensive, accurate flashcards covering every important fact, term, definition, formula, and question. Do not invent information. Flag anything unreadable instead of guessing. Return ONLY valid JSON (no Markdown code fence) in this exact format:\n{"title":"Study Guide Title","cards":[{"front":"Question?","back":"Concise correct answer"}]}\nMake each card test one concept. Avoid duplicates. I will import the JSON into my offline StudyStack app.`;function copyPrompt(){navigator.clipboard?.writeText(prompt).then(()=>alert('Prompt copied! Upload your study guide pictures to ChatGPT and paste the prompt.')).catch(()=>window.prompt('Copy this prompt:',prompt))||(!navigator.clipboard&&window.prompt('Copy this prompt:',prompt))}function exportScreen(){mode='export';let d=deck();set(`${head(d)}<div class="panel" style="max-width:760px;margin:20px auto"><h2>Share this study guide</h2><p class="muted">Download a standalone HTML study app containing this deck. Send the HTML file to anyone. They can open it in a browser without ChatGPT or an account. Their mastery ratings are stored on their own device.</p><div class="row">${btn('Download shareable HTML','shareHtml','primary')}${btn('Download JSON backup','exportJson')}</div><hr class="divider"><p class="note">Some messaging apps restrict opening HTML attachments. In that case, share the file through a file-sharing service or host it as a static web page. A normal clickable website URL requires hosting.</p><p class="muted small">For privacy, shared HTML contains the study questions and answers only, not your mastery ratings.</p></div>`)}function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'study-deck'}function exportJson(){let d=deck();download(new Blob([JSON.stringify({title:d.name,cards:d.cards.map(c=>({front:c.q,back:c.a}))},null,2)],{type:'application/json'}),slug(d.name)+'.json')}function shareHtml(){let d=deck(),payload={decks:[{...d,id:uid(),cards:d.cards.map(c=>({...c,id:uid(),known:false}))}]};let html=document.documentElement.outerHTML;html=html.replace('<script>','<script>window.__SHARED_DECK__='+JSON.stringify(payload).replace(/</g,'\\u003c')+';<\/script><script>');download(new Blob(['<!doctype html>'+html],{type:'text/html'}),slug(d.name)+'-flashcards.html')}function reset(){if(!confirm('Reset all cards to “Don’t know”? No cards will be deleted.'))return;deck().cards.forEach(c=>c.known=false);save();renderDeck()}function del(id){if(!confirm('Delete this flashcard permanently?'))return;deck().cards=deck().cards.filter(c=>c.id!==id);save();edit()}function act(a){if(a==='refreshShared')return loadShared(true);if(a==='home')return home();if(a==='new')return newDeck();if(a==='import')return importScreen(false);if(a==='importMore')return importScreen(true);if(a==='doImport')return doImport();if(a==='prompt')return copyPrompt();if(a==='deck')return renderDeck();if(a==='study')return begin('study');if(a==='quiz')return begin('quiz');if(a==='edit')return edit();if(a==='add')return cardForm();if(a.startsWith('modify:'))return cardForm(a.slice(7));if(a.startsWith('delete:'))return del(a.slice(7));if(a==='export')return exportScreen();if(a==='shareHtml')return shareHtml();if(a==='exportJson')return exportJson();if(a==='reset')return reset();if(a==='yes')return rate(true);if(a==='no')return rate(false);if(a==='next'){idx=(idx+1)%pool().length;flip=false;learningTaps=0;learningMode=false;return renderStudy()}if(a==='prev'){idx=(idx-1+pool().length)%pool().length;flip=false;learningTaps=0;learningMode=false;return renderStudy()}if(a==='all'||a==='unknown'){filter=a;idx=0;flip=false;learningTaps=0;learningMode=false;order=deck().cards.map(c=>c.id);return mode==='quiz'?renderQuiz():renderStudy()}if(a==='qnext'){quizIndex=(quizIndex+1)%pool().length;quizAnswered=false;return renderQuiz()}if(a==='qyes'||a==='qno'){let p=pool(),c=deck().cards.find(c=>c.id===p[quizIndex]);c.known=a==='qyes';save();quizIndex=0;quizAnswered=false;return renderQuiz()}}document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b){e.preventDefault();e.stopPropagation();if(b.disabled)return;act(b.dataset.act);return}let o=e.target.closest('[data-open]');if(o)open(o.dataset.open)});async function loadShared(showStatus=false){
  const status=showStatus?()=>alert('Shared decks refreshed.'):()=>{};
  try{
    const response=await fetch('decks/index.json',{cache:'no-store'});
    if(!response.ok)throw Error('Cannot load deck catalog ('+response.status+').');
    const catalog=await response.json();
    if(!Array.isArray(catalog.decks))throw Error('Invalid deck catalog.');
    let changed=false,loaded=0;
    for(const entry of catalog.decks){
      const filename=entry.file;
      if(typeof filename!=='string'||!/^[-a-zA-Z0-9_]+\.json$/.test(filename))continue;
      const r=await fetch('decks/'+filename,{cache:'no-store'});
      if(!r.ok)continue;
      let parsed;
      try{parsed=normalize(await r.json())}catch{continue}
      const existing=db.decks.find(d=>d.sharedFile===filename);
      if(existing){
        const oldByQuestion=new Map(existing.cards.map(c=>[c.q+'\u0000'+c.a,c]));
        const cards=parsed.cards.map(c=>{let old=oldByQuestion.get(c.q+'\u0000'+c.a);return {id:old?.id||uid(),q:c.q,a:c.a,known:old?.known||false}});
        if(JSON.stringify(existing.cards)!==JSON.stringify(cards)||existing.name!==parsed.name){existing.cards=cards;existing.name=parsed.name;changed=true}
      }else{
        const created=makeDeck(parsed.name,parsed.cards);created.sharedFile=filename;
        db.decks.push(created);changed=true;
      }
      loaded++;
    }
    if(changed)save();
    if(mode==='home')home();
    if(showStatus)alert('Shared decks available: '+loaded+'. Your mastery progress was preserved.');
  }catch(err){if(showStatus)alert('Could not refresh shared decks: '+err.message+'\nCheck GitHub Pages and decks/index.json.');}
}
document.getElementById('homeBtn').onclick=home;document.getElementById('newBtn').onclick=newDeck;if(window.__SHARED_DECK__&& !sessionStorage.getItem('studystack-shared-imported')){let incoming=window.__SHARED_DECK__.decks||[];for(let d of incoming){if(!db.decks.some(x=>x.name===d.name&&x.cards.length===d.cards.length)){db.decks.push({...d,id:uid(),cards:d.cards.map(c=>({...c,id:uid(),known:false}))})}}save();try{sessionStorage.setItem('studystack-shared-imported','1')}catch{}}home();loadShared();})();
</script></body></html>
