function mathLesson(m){const a=m.a%10,b=m.b%10,ta=Math.floor(m.a/10),tb=Math.floor(m.b/10);let steps=[];
if(m.op==='+'){steps.push(`Start with the ones: ${a} + ${b} = ${a+b}.`);if(m.carry){steps.push(`Since ${a+b} is 10 or more, write ${(a+b)%10} in the ones place and carry 1 ten.`);steps.push(`Add the tens, including the carried ten: ${ta} + ${tb} + 1 = ${ta+tb+1}.`)}else{steps.push(`Write ${a+b} in the ones place. No carrying is needed.`);steps.push(`Add the tens: ${ta} + ${tb} = ${ta+tb}.`)}
}else{steps.push(`Start with the ones: ${a} − ${b}.`);if(m.borrow){steps.push(`You cannot subtract ${b} ones from ${a} ones. Trade one ten for 10 ones.`);steps.push(`${ta} tens become ${ta-1} tens, and ${a} ones become ${a+10} ones.`);steps.push(`Subtract the ones: ${a+10} − ${b} = ${a+10-b}.`);steps.push(`Subtract the tens: ${ta-1} − ${tb} = ${ta-1-tb}.`)}else{steps.push(`Subtract the ones: ${a} − ${b} = ${a-b}. No borrowing is needed.`);steps.push(`Subtract the tens: ${ta} − ${tb} = ${ta-tb}.`)}}
steps.push(`Put the tens and ones together: ${m.a} ${m.op} ${m.b} = ${m.result}.`);return steps.map((x,i)=>`<p class="math-lesson-step"><b>Step ${i+1}.</b> ${esc(x)}</p>`).join('')}
function mathVideo(m){
const a=m.a%10,b=m.b%10,ta=Math.floor(m.a/10),tb=Math.floor(m.b/10);

if(m.op==='−'||m.op==='-'){
if(m.borrow){steps.push({title:'Trade one ten',body:`${ta} tens → ${ta-1} tens; ${a} ones → ${a+10} ones`,detail:'Move one group of ten into the ones column. The number stays the same.'});}
steps.push({title:'Solve the ones',body:`${m.borrow?a+10:a} − ${b} = ${(m.borrow?a+10:a)-b}`,detail:'Write this digit in the ones place.'});
steps.push({title:'Solve the tens',body:`${ta-(m.borrow?1:0)} − ${tb} = ${ta-(m.borrow?1:0)-tb}`,detail:'Remember to use the smaller tens digit if you borrowed.'});
}else{
steps.push({title:'Add the ones',body:`${a} + ${b} = ${a+b}`,detail:m.carry?'Write the ones digit and carry 1 ten.':'Write the sum in the ones place.'});

}

function mathVerticalLesson(m,step,total){
 const borrow=m.borrow&&m.op!=='+',carry=m.carry&&m.op==='+';
 const aT=Math.floor(m.a/10),aO=m.a%10,bT=Math.floor(m.b/10),bO=m.b%10;
 const final=step===total-1;
 const showOnes=final||step>=(borrow?2:1);
 const showTens=final||step>=(borrow?3:2);
 const ansT=showTens?Math.floor(m.result/10):'',ansO=showOnes?m.result%10:'';
 const cell=(n,highlight=false)=>`<span style="text-align:center;${highlight?'color:#f9ce77;':''}">${n===''?'&nbsp;':n}</span>`;
 const row=(sign,t,o,rule=false)=>`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;${rule?'border-top:3px solid #f9ce77;':''}">${cell(sign,!!sign)}${cell(t)}${cell(o)}</div>`;
 const note=borrow&&step>=1?row('',aT-1,aO+10):carry&&step>=1?row('','1',''):row('','','');
 return `<div aria-label="Vertical ${m.op==='+'?'addition':'subtraction'} ${m.a} ${m.op} ${m.b}" style="font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-size:clamp(34px,10vw,54px);line-height:1.35;width:min(100%,240px);margin:0 auto;">
 <div style="font-size:.48em;color:#f9ce77;min-height:1.2em">${note}</div>
 ${row('',aT,aO)}
 ${row(m.op==='+'?'+':'−',m.b>=10?bT:'',bO)}
 ${row('',ansT,ansO,true)}
 </div>`;
}
function bindMathLesson(m){let box=document.getElementById('mathVideoBox');if(!box)return;const a=m.a%10,b=m.b%10,ta=Math.floor(m.a/10),tb=Math.floor(m.b/10),sub=m.op!=='+';
let steps=[['Read the problem',`${m.a} ${m.op} ${m.b}`,'Start with the ones column on the right.']];
if(sub){if(m.borrow)steps.push(['Borrow one ten',`${ta} tens → ${ta-1} tens   |   ${a} ones → ${a+10} ones`,'One ten becomes ten ones. The total does not change.']);steps.push(['Subtract the ones',`${a+(m.borrow?10:0)} − ${b} = ${a+(m.borrow?10:0)-b}`,'Write the result in the ones place.']);steps.push(['Subtract the tens',`${ta-(m.borrow?1:0)} − ${tb} = ${ta-(m.borrow?1:0)-tb}`,m.borrow?'You borrowed one ten, so subtract using the remaining tens.':'No borrowing was needed. Subtract the tens normally.']);}
else{steps.push(['Add the ones',`${a} + ${b} = ${a+b}`,m.carry?'Carry one ten to the tens column.':'No carrying needed.']);steps.push(['Add the tens',`${ta} + ${tb}${m.carry?' + 1':''} = ${ta+tb+(m.carry?1:0)}`,'Remember the carried ten if there is one.']);}
steps.push(['Final answer',`${m.a} ${m.op} ${m.b} = ${m.result}`,'You finished the problem.']);let i=0;
function draw(){document.getElementById('mathLessonCount').textContent=`Step ${i+1} of ${steps.length}`;document.getElementById('mathLessonTitle').textContent=steps[i][0];document.getElementById('mathLessonEquation').innerHTML=mathVerticalLesson(m,i,steps.length);document.getElementById('mathLessonDetail').textContent=steps[i][2];document.getElementById('mathLessonPrev').disabled=i===0;document.getElementById('mathLessonNext').disabled=i===steps.length-1;}
document.getElementById('mathLessonPrev').onclick=()=>{i=Math.max(0,i-1);draw();speakDevice(steps[i][0]+'. '+steps[i][2])};document.getElementById('mathLessonNext').onclick=()=>{i=Math.min(steps.length-1,i+1);draw();speakDevice(steps[i][0]+'. '+steps[i][2])};draw();bindMathVideoSpeech(m);}

const sub=m.op!=='+';const borrow=m.borrow,carry=m.carry;
const phrases=sub?(borrow?['Start in the ones column. Two minus eight needs borrowing.','Trade one ten for ten ones.','Twelve minus eight equals four. Four minus two equals two.','The answer is twenty-four.']:['Start in the ones column.','Nine minus eight equals one.','Five minus one equals four.','The answer is forty-one.']):(carry?['Start in the ones column.','Seven plus eight equals fifteen. Write five and carry one ten.','Four plus two plus one equals seven.','The answer is seventy-five.']:['Start in the ones column.','Four plus five equals nine.','Three plus two equals five.','The answer is fifty-nine.']);

const replay=document.getElementById('mathReplaySpeech');if(replay)replay.onclick=()=>narrate(true);
}

function availableVoices(){return 'speechSynthesis' in window?speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)):[]}
function preferredVoice(){
 const voices=availableVoices();
 const name=v=>v.name.toLowerCase().trim();
 const enhanced=v=>/enhanced|premium/.test(name(v));
 const evan=voices.find(v=>/\bevan\b/.test(name(v))&&enhanced(v));
 if(evan)return evan;
 const samantha=voices.find(v=>/\bsamantha\b/.test(name(v))&&enhanced(v));
 if(samantha)return samantha;
 // Exclude novelty voices; prefer Safari's default normal English voice.
 const novelty=/^(albert|bad news|bahh|bells|boing|bubbles|cellos|fred|good news|jester|junior|kathy|organ|ralph|superstar|trinoids|whisper|wobble|zarvox)$/i;
 const normal=voices.filter(v=>!novelty.test(v.name.trim()));
 return normal.find(v=>v.default)||normal.find(v=>/^(samantha|ava|allison|alex|daniel|karen|moira|nathan|tom|victoria|serena|joelle|noelle|nicky)$/i.test(v.name.trim()))||normal.find(v=>/^en[-_]us$/i.test(v.lang))||normal[0]||null;
}

function renderQuiz(){let d=deck(),p=pool();if(d)d.subject=subjectForDeck(d);if(!p.length){set(`${head(d)}<div class="panel">No cards in this stack. ${btn('Include all','all')}</div>`);return}quizIndex=Math.min(quizIndex,p.length-1);let c=d.cards.find(x=>x.id===p[quizIndex]),m=mathParts(c.q),g=isGrammarDeck(d)?grammarParts(c):null;if(isSpellingDeck(d)){renderSpellingQuiz(d,p,c);return}if(m){set(`${head(d)}<div class="study panel"><span class="pill">Math question ${quizIndex+1} of ${p.length}</span><p class="muted small">Enter the tens and ones digits, then check your answer.</p>${mathUI(c,'quiz')}<div class="row" style="margin-top:14px">${mathChecked?btn('Next →','qnext','primary'):''}</div></div>`);bindMath();return}if(g){set(`${head(d)}<div class="study panel"><span class="pill">Quiz question ${quizIndex+1} of ${p.length}</span><h2 style="white-space:pre-line;margin:20px 0">${esc(g.prompt).replace(/\[([^\]\n]+)\]/g,'<mark class="grammar-highlight">$1</mark>')}</h2>${g.choices.map(o=>`<button class="btn quizOpt ${quizAnswered?(o.letter===g.correct?'correct':o.letter===quizSelected?'wrong':''):''}" data-choice="${o.letter}" ${quizAnswered?'disabled':''}>${esc(o.letter+'. '+o.label)}</button>`).join('')}${quizAnswered?`<div class="math-feedback"><strong>${quizSelected===g.correct?'Correct!':'Not quite.'}</strong><p>Correct: ${esc(g.correct+'. '+g.answer)}</p><p>${esc(g.reason)}</p></div>`:''}<div class="row">${btn('Know it','qyes','good')}${btn('Don’t know','qno','bad')}${btn('Next →','qnext')}</div></div>`);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{quizSelected=b.dataset.choice;quizAnswered=true;renderQuiz()});return}if(!quizOptions||quizOptions.id!==c.id){let others=randomize(d.cards.filter(x=>x.id!==c.id&&x.a!==c.a)).slice(0,3);quizOptions={id:c.id,choices:randomize([c,...others])}}set(`${head(d)}<div class="study panel"><span class="pill">Quiz question ${quizIndex+1} of ${p.length}</span><h2 style="white-space:pre-line;margin:22px 0">${face(c)}</h2>${quizOptions.choices.map(o=>`<button class="btn quizOpt ${quizAnswered?(o.id===c.id?'correct':o.id===quizSelected?'wrong':''):''}" data-choice="${o.id}" ${quizAnswered?'disabled':''}>${esc(o.a)}</button>`).join('')}${quizAnswered?`<p class="notice">${quizSelected===c.id?'Correct!':'Correct answer: '+esc(c.a)}</p>`:''}<div class="row">${btn('Know it','qyes','good')}${btn('Don’t know','qno','bad')}${btn('Next →','qnext')}</div></div>`);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{quizSelected=b.dataset.choice;quizAnswered=true;renderQuiz()})}
function edit(){mode='edit';let d=deck();set(`${head(d)}<div class="row space" style="margin:15px 0"><h2>Master card list</h2>${btn('+ Add card','add','primary')}</div><div class="list">${d.cards.map((c,i)=>`<div class="item"><span class="pill">Card ${i+1} · ${c.known?'Known':'Review'}</span><div class="row">${btn('Edit','modify:'+c.id)}${btn('Delete','delete:'+c.id,'bad')}</div><strong>${face(c)}</strong><div class="answer">${face(c,true)}</div></div>`).join('')}</div>${btn('Import more cards','importMore')}`)}function cardForm(id){let d=deck(),c=id?d.cards.find(x=>x.id===id):null;mode='form';set(`${head(d)}<div class="panel"><h2>${c?'Edit':'Add'} flashcard</h2><form id="cardForm"><label>Question / front</label><textarea id="question" required>${esc(c?.q||'')}</textarea><label>Answer / back</label><textarea id="answer" required>${esc(c?.a||'')}</textarea><div class="row"><button class="btn primary" type="submit">Save card</button>${btn('Cancel','edit')}</div></form></div>`);document.getElementById('cardForm').onsubmit=e=>{e.preventDefault();let q=document.getElementById('question').value.trim(),a=document.getElementById('answer').value.trim();if(!q||!a)return;if(c){c.q=q;c.a=a}else d.cards.push({id:uid(),q,a,known:false});save();edit()}}function newDeck(){mode='new';set(`<div class="panel"><h1>Create a deck</h1><form id="newForm"><label>Deck name</label><input id="deckName" required placeholder="Math Chapter 4"><button class="btn primary" style="margin-top:14px">Create deck</button></form></div>`);document.getElementById('newForm').onsubmit=e=>{e.preventDefault();let d=makeDeck(document.getElementById('deckName').value.trim());db.decks.push(d);save();open(d.id)}}function normalize(raw){let o=typeof raw==='string'?JSON.parse(raw):raw,cards=Array.isArray(o)?o:o.cards||o.flashcards||o.questions;if(!Array.isArray(cards))throw Error('JSON must contain a cards array.');let result=cards.map(c=>({q:String(c.q??c.front??c.question??'').trim(),a:String(c.a??c.back??c.answer??'').trim()})).filter(c=>c.q&&c.a);if(!result.length)throw Error('No valid cards found.');return {name:Array.isArray(o)?'Imported study guide':String(o.title||o.name||'Imported study guide'),subject:Array.isArray(o)?'':String(o.subject||''),cards:result}}function importScreen(more=false){mode='import';window.importMore=more;set(`<h1>${more?'Add cards to this deck':'Import flashcards'}</h1><div class="panel"><label>Choose JSON file</label><input type="file" id="jsonFile" accept=".json,application/json,.txt"><label>Or paste JSON</label><textarea id="jsonText" style="min-height:180px" placeholder='{"title":"Math","cards":[{"front":"67 + 12","back":"79"}]}'></textarea><div class="row">${btn('Import cards','doImport','primary')}${btn('Cancel',more?'deck':'home')}</div><p id="importError" style="color:#ff9daf"></p></div>`);document.getElementById('jsonFile').onchange=async e=>{let f=e.target.files[0];if(f)document.getElementById('jsonText').value=await f.text()}}function doImport(){try{let n=normalize(document.getElementById('jsonText').value);if(window.importMore&&deck()){deck().cards.push(...n.cards.map(c=>({...c,id:uid(),known:false})));save();edit()}else{let d=makeDeck(n.name,n.cards);d.subject=subjectForEntry({title:n.name,subject:n.subject});db.decks.push(d);save();open(d.id)}}catch(e){document.getElementById('importError').textContent=e.message}}function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'study-deck'}function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}function exportScreen(){mode='export';let d=deck();set(`${head(d)}<div class="panel"><h2>Share or export</h2><p class="muted">Download a JSON backup or standalone HTML study app.</p><div class="row">${btn('Download JSON','exportJson','primary')}${btn('Download shareable HTML','shareHtml')}</div></div>`)}function exportJson(){let d=deck();download(new Blob([JSON.stringify({title:d.name,cards:d.cards.map(c=>({front:c.q,back:c.a}))},null,2)],{type:'application/json'}),slug(d.name)+'.json')}function shareHtml(){let d=deck(),payload={decks:[{...d,id:uid(),cards:d.cards.map(c=>({...c,id:uid(),known:false}))}]};let html=document.documentElement.outerHTML.replace('<script>','<script>window.__SHARED_DECK__='+JSON.stringify(payload).replace(/</g,'\\u003c')+';<\/script><script>');download(new Blob(['<!doctype html>'+html],{type:'text/html'}),slug(d.name)+'-flashcards.html')}function reset(){if(!confirm('Reset all cards to Don’t know?'))return;deck().cards.forEach(c=>c.known=false);save();renderDeck()}function del(id){if(!confirm('Delete this card?'))return;deck().cards=deck().cards.filter(c=>c.id!==id);save();edit()}
function act(a){if(a==='home')return home();if(a==='help')return showHelp();if(a==='myDecks')return myDecks();if(a==='library')return showLibrary();if(a==='new')return newDeck();if(a==='import')return importScreen(false);if(a==='importMore')return importScreen(true);if(a==='doImport')return doImport();if(a==='deck')return renderDeck();if(a==='study')return begin('study');if(a==='quiz')return begin('quiz');if(a==='edit')return edit();if(a==='add')return cardForm();if(a.startsWith('modify:'))return cardForm(a.slice(7));if(a.startsWith('delete:'))return del(a.slice(7));if(a==='export')return exportScreen();if(a==='exportJson')return exportJson();if(a==='shareHtml')return shareHtml();if(a==='reset')return reset();if(a==='yes'||a==='no')return rate(a==='yes');if(a==='prev'||a==='next'){idx=(idx+(a==='next'?1:-1)+pool().length)%pool().length;flip=false;learningMode=false;resetMath();return renderStudy()}if(a==='all'||a==='unknown'){filter=a;return begin(mode==='quiz'?'quiz':'study')}if(a==='qnext'){quizIndex=(quizIndex+1)%pool().length;quizAnswered=false;quizSelected=null;quizOptions=null;resetMath();return renderQuiz()}if(a==='qyes'||a==='qno'){let p=pool(),c=deck().cards.find(x=>x.id===p[quizIndex]);c.known=a==='qyes';save();quizIndex=filter==='all'?(quizIndex+1)%Math.max(1,pool().length):Math.min(quizIndex,Math.max(0,pool().length-1));quizAnswered=false;quizSelected=null;quizOptions=null;resetMath();return renderQuiz()}}document.addEventListener('click',e=>{if(e.target.closest('[data-date-area]'))return;let rm=e.target.closest('[data-remove]');if(rm){e.preventDefault();e.stopPropagation();removeDeck(rm.dataset.remove);return}let pick=e.target.closest('[data-pick]');if(pick){e.preventDefault();e.stopPropagation();addShared(pick.dataset.pick);return}let b=e.target.closest('[data-act]');if(b){e.preventDefault();e.stopPropagation();if(!b.disabled)act(b.dataset.act);return}let o=e.target.closest('[data-open]');if(o)open(o.dataset.open)});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();open(e.target.dataset.open)}});
async function fetchCatalog(){let lists=[];for(const url of ['decks/index.json','decks/flashcards-additions.json']){try{let r=await fetch(url,{cache:'no-store'});if(r.ok){let data=await r.json();if(Array.isArray(data.decks))lists.push(...data.decks)}}catch(e){}}if(!lists.length)throw Error('Cannot load deck catalogs. Upload decks/index.json or decks/flashcards-additions.json.');let seen=new Set();sharedCatalog=lists.filter(x=>{if(typeof x.file!=='string'||!/^[-a-zA-Z0-9_]+\.json$/.test(x.file)||seen.has(x.file))return false;seen.add(x.file);return true});return sharedCatalog}async function showLibrary(){mode='library';current=null;set('<h1>Shared Deck Library</h1><div class="panel">Loading available decks…</div>');try{await fetchCatalog();renderLibrary()}catch(e){set(`<h1>Shared Deck Library</h1><div class="panel">${esc(e.message)} ${btn('Try again','library')}</div>`)}}let librarySubject='';
const SUBJECTS=['English Reading','Religion','Math','Social Studies','Spelling'];
function subjectForEntry(entry){
 const file=String(entry.file||'').toLowerCase(),title=String(entry.title||'').toLowerCase();
 const explicit=String(entry.subject||'').toLowerCase().trim(),category=String(entry.category||'').toLowerCase().trim();
 const combined=[file,title,explicit,category].join(' ');
 // Spelling takes precedence over an older generic English subject label.
 if(/spell|dictation/.test(combined))return 'Spelling';
 if(/social.stud|government|history|geograph|civic|president|constitution/.test(combined))return 'Social Studies';
 if(/religion|bible|scripture|christ|jesus|faith|catholic/.test(combined))return 'Religion';
 if(/math|arithmet|addition|subtract|multipli|division|fraction|regroup|number/.test(combined))return 'Math';
 // Existing Grammar, English, Reading, Prepositions and legacy Other all belong here.
 return 'English Reading';
}
function subjectForDeck(d){
 if(d.subject&&SUBJECTS.includes(d.subject))return d.subject;
 const entry=sharedCatalog.find(x=>x.file===d.sharedFile);
 return subjectForEntry(entry||{file:d.sharedFile||'',title:d.name||'',subject:d.subject||''});
}
function renderLibrary(){
 mode='library';
 const subjects=SUBJECTS;
 const selected=subjects.includes(librarySubject)?librarySubject:'';
 const visible=selected?sharedCatalog.filter(entry=>subjectForEntry(entry)===selected).sort((a,b)=>compareStudyGuides(a,b,subjectForEntry)):[];
 set(`<div class="row space"><h1>Shared Deck Library</h1><div class="row">${btn('How to Use','help')}${btn('Refresh library','library')}${btn('My Decks','myDecks')}</div></div><div class="panel" style="max-width:700px"><label for="librarySubject">Choose a subject</label><select id="librarySubject" aria-label="Choose a subject"><option value="">Select a subject…</option>${subjects.map(subject=>`<option value="${esc(subject)}" ${subject===selected?'selected':''}>${esc(subject)} (${sharedCatalog.filter(entry=>subjectForEntry(entry)===subject).length})</option>`).join('')}</select><p class="muted small" style="margin-bottom:0">Select a subject to see its available study guides.</p></div>${selected?`<h2>${esc(selected)} Study Guides</h2><p class="muted small">${visible.length} ${visible.length===1?'study guide':'study guides'} available</p><div class="grid">${visible.map(entry=>{let d=db.decks.find(x=>x.sharedFile===entry.file),added=!!d&&!d.hidden;return `<div class="panel deck-card"><span class="pill">🌐 ${esc(selected)}</span><strong>${esc(entry.title||d?.name||entry.file)}</strong><span class="muted small">${d?d.cards.length+' flashcards':'Available to add'}</span>${added?`<button class="btn bad" data-remove="${esc(d.id)}">Remove from my decks</button>`:`<button class="btn primary" data-pick="${esc(entry.file)}">${d?'Restore deck':'Add to my decks'}</button>`}</div>`}).join('')}</div>`:`<div class="panel" style="text-align:center"><h2>${subjects.length?'Choose a subject above':'No shared decks listed yet'}</h2><p class="muted">${subjects.length?'Study guides will appear here after you select a subject.':'Upload JSON decks to your GitHub decks folder to get started.'}</p></div>`}`);
 const selector=document.getElementById('librarySubject');
 if(selector)selector.onchange=e=>{librarySubject=e.target.value;renderLibrary()};
}
async function addShared(file){if(!sharedCatalog.some(e=>e.file===file))return;let existing=db.decks.find(d=>d.sharedFile===file);if(existing){existing.hidden=false;existing.subject=subjectForEntry(sharedCatalog.find(x=>x.file===file)||{file,title:existing.name});save();renderLibrary();return}try{let r=await fetch('decks/'+file,{cache:'no-store'});if(!r.ok)throw Error('Deck unavailable ('+r.status+').');let parsed=normalize(await r.json()),d=makeDeck(parsed.name,parsed.cards);d.sharedFile=file;d.subject=subjectForEntry(sharedCatalog.find(x=>x.file===file)||{file,title:parsed.name});db.decks.push(d);save();renderLibrary()}catch(e){alert('Could not add deck: '+e.message)}}function removeDeck(id){let d=db.decks.find(x=>x.id===id);if(!d)return;if(d.sharedFile){if(!confirm('Remove deck from My Decks? Your progress is retained.'))return;d.hidden=true}else{if(!confirm('Permanently delete this deck and its progress?'))return;db.decks=db.decks.filter(x=>x.id!==id)}save();mode==='library'?renderLibrary():myDecks()}async function loadShared(){try{let entries=await fetchCatalog(),changed=false;for(let d of db.decks.filter(x=>x.sharedFile)){if(!entries.some(e=>e.file===d.sharedFile))continue;let r=await fetch('decks/'+d.sharedFile,{cache:'no-store'});if(!r.ok)continue;let parsed;try{parsed=normalize(await r.json())}catch{continue}let category=subjectForEntry(entries.find(x=>x.file===d.sharedFile)||{file:d.sharedFile,title:parsed.name});if(d.subject!==category){d.subject=category;changed=true}let old=new Map(d.cards.map(c=>[c.q+'\u0000'+c.a,c])),cards=parsed.cards.map(c=>{let prior=old.get(c.q+'\u0000'+c.a);return {id:prior?.id||uid(),q:c.q,a:c.a,known:prior?.known||false}});if(JSON.stringify(d.cards)!==JSON.stringify(cards)||d.name!==parsed.name){d.cards=cards;d.name=parsed.name;changed=true}}if(changed)save();if(mode==='home')home()}catch{}}document.getElementById('helpBtn').onclick=showHelp;document.getElementById('homeBtn').onclick=home;document.getElementById('newBtn').onclick=newDeck;if(window.__SHARED_DECK__){try{if(!sessionStorage.getItem('studystack-shared-imported')){for(let d of window.__SHARED_DECK__.decks||[]){if(!db.decks.some(x=>x.name===d.name&&x.cards.length===d.cards.length))db.decks.push({...d,id:uid(),cards:d.cards.map(c=>({...c,id:uid(),known:false}))})}save();sessionStorage.setItem('studystack-shared-imported','1')}}catch{}}home();loadShared()})();
</script></body></html>
