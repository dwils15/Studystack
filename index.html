
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b36">
<title>StudyStack v8.15 — Flashcards</title>
<style>
:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    "Segoe UI", sans-serif;
  color: #eaf0ff;
  background: #0b1225;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 75% 0,
    #203967 0, transparent 36%), #0b1225;
}
button,input,textarea,select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
.shell {
  max-width: 1100px;
  margin: auto;
  padding: 24px 18px 70px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}
.logo {
  font-weight: 850;
  font-size: 24px;
  letter-spacing: -.8px;
}
.logo span { color: #79a9ff; }
.logo small {
  font-size: 12px;
  color: #a8c6ff;
  letter-spacing: 0;
}
h1 {
  font-size: clamp(28px,4vw,40px);
  letter-spacing: -1px;
  margin: 0 0 8px;
}
h2 { font-size: 22px; margin: 0 0 12px; }
p { line-height: 1.55; }
a { color: #a9c7ff; }
.muted { color: #a5b4d0; }
.small { font-size: 13px; }
.row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.space { justify-content: space-between; }
.btn {
  border: 1px solid #405277;
  background: #23355a;
  color: #f2f6ff;
  border-radius: 12px;
  padding: 11px 15px;
  font-weight: 700;
}
.btn:hover { background: #314976; }
.btn.primary {
  background: #6698ff;
  color: #09142d;
  border-color: #6698ff;
}
.btn.good {
  background: #1b6d5a;
  border-color: #2cae8d;
}
.btn.bad {
  background: #69384e;
  border-color: #c76c89;
}
.btn.danger {
  background: #382436;
  border-color: #82475a;
  color: #ffb4c4;
}
.btn.ghost { background: transparent; }
.wide { width: 100%; }
.panel {
  background: #151f37;
  border: 1px solid #30405f;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 14px 40px #03071422;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(245px,1fr));
  gap: 14px;
}
.deck {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 170px;
  text-align: left;
}
.deck strong { font-size: 19px; }
.deck .foot { margin-top: auto; }
.pill {
  display: inline-block;
  background: #293d64;
  border-radius: 99px;
  padding: 5px 10px;
  color: #bcd0f7;
  font-size: 12px;
  font-weight: 750;
}
input,textarea,select {
  width: 100%;
  border: 1px solid #435474;
  border-radius: 12px;
  padding: 12px;
  background: #0d172b;
  color: white;
}
textarea { min-height: 100px; resize: vertical; }
label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin: 12px 0 6px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 20px 0;
}
.stat {
  background: #101b32;
  border: 1px solid #2e4062;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
}
.stat b { display: block; font-size: 27px; }
.stat span { color: #a8b9d6; font-size: 12px; }
.progress {
  height: 9px;
  background: #2c3b5b;
  border-radius: 10px;
  overflow: hidden;
}
.progress > div {
  height: 100%;
  background: #48c6a1;
}
.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}
.study { max-width: 760px; margin: auto; }
.card {
  min-height: 285px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 35px;
  cursor: pointer;
  background: linear-gradient(145deg,#1d3255,#14223d);
  border: 1px solid #58729f;
  border-radius: 22px;
  user-select: none;
}
.card h2 {
  font-size: clamp(18px,3vw,29px);
  line-height: 1.4;
  white-space: pre-line;
  overflow-wrap: anywhere;
}
.card .hint {
  color: #9db4d7;
  font-size: 13px;
  margin-top: 15px;
}
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.actions .btn { padding: 16px; }
.list { display: grid; gap: 10px; }
.item {
  background: #101b32;
  border: 1px solid #30415e;
  border-radius: 13px;
  padding: 14px;
}
.item strong { display: block; margin-bottom: 6px; }
.item .answer { color: #b6c7e3; }
.empty { text-align: center; padding: 45px 20px; }
.divider {
  border: 0;
  border-top: 1px solid #34425e;
  margin: 20px 0;
}
.footnote {
  margin-top: 35px;
  text-align: center;
  color: #8295b7;
  font-size: 12px;
}
.quizOpt {
  width: 100%;
  display: block;
  text-align: left;
  margin: 8px 0;
}
.quizOpt.correct {
  border-color: #46caa0;
  background: #174c42;
}
.quizOpt.wrong {
  border-color: #e47c96;
  background: #552d40;
}
.grammar-highlight {
  background: #ffdc65;
  color: #18233b;
  border-radius: 4px;
  padding: 0 3px;
  font-weight: 850;
}
.welcome {
  margin: 20px 0 26px;
  max-width: 720px;
}
.welcome-eyebrow {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.6px;
  color: #95b8ff;
}
.welcome h1 {
  margin: 12px 0;
  font-size: clamp(30px,5vw,44px);
}
.welcome p { font-size: 16px; }
.home-options {
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-width: 800px;
}
.home-option {
  display: flex;
  align-items: center;
  gap: 17px;
  width: 100%;
  min-height: 112px;
  text-align: left;
  border: 1px solid #405579;
  border-radius: 20px;
  padding: 22px;
  background: #172844;
  color: #f2f6ff;
}
.home-option:hover { background: #22385c; }
.home-option-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: #263d63;
  border-radius: 15px;
  font-size: 29px;
  width: 64px;
  height: 64px;
}
.home-option-copy {
  display: grid;
  gap: 7px;
  flex: 1;
}
.home-option-copy strong { font-size: 22px; }
.home-option-copy small {
  font-size: 14px;
  color: #bac9e4;
  line-height: 1.4;
}
.home-arrow { font-size: 35px; color: #9bb7e8; }
.home-help {
  max-width: 800px;
  margin: 20px 0 0;
  padding: 23px;
  background: #131f37;
  border: 1px solid #30405f;
  border-radius: 20px;
}
.how-steps {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 16px;
}
.how-steps > div {
  display: flex;
  align-items: flex-start;
  gap: 9px;
}
.how-steps span {
  background: #294a80;
  color: #d5e4ff;
  font-weight: 800;
  border-radius: 50%;
  min-width: 28px;
  height: 28px;
  text-align: center;
  line-height: 28px;
}
.how-steps p {
  margin: 0;
  color: #b6c8e5;
  font-size: 13px;
}
.how-steps strong { color: #f1f6ff; }
.home-secondary { margin: 18px 0; }
.lesson-player {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  margin-top: 12px;
  background: #090e1b;
  border-radius: 12px;
  overflow: hidden;
}
.lesson-player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* Vertical math display for ordinary flashcards */
.math-equation {
  display: inline-grid;
  grid-template-columns: 1.1em 1em 1em;
  grid-template-rows: .8em 1.12em 1.12em .13em 1.12em;
  align-items: center;
  justify-items: center;
  font-family: ui-monospace,monospace;
  font-size: clamp(40px,9vw,68px);
  font-weight: 750;
  line-height: 1;
  white-space: nowrap;
  margin: 12px auto;
}
.math-equation .carry,
.math-equation .borrow-tens,
.math-equation .borrow-ones {
  grid-row: 1;
  color: #ffc66d;
  font-size: .4em;
  align-self: end;
}
.math-equation .carry,
.math-equation .borrow-tens { grid-column: 2; }
.math-equation .borrow-ones { grid-column: 3; }
.math-equation .top-tens { grid-column: 2; grid-row: 2; }
.math-equation .top-ones { grid-column: 3; grid-row: 2; }
.math-equation .plus { grid-column: 1; grid-row: 3; }
.math-equation .bottom-tens { grid-column: 2; grid-row: 3; }
.math-equation .bottom-ones { grid-column: 3; grid-row: 3; }
.math-equation .math-line {
  grid-column: 1/4;
  grid-row: 4;
  width: 100%;
  height: 3px;
  background: currentColor;
}
.math-equation .result-tens {
  grid-column: 2;
  grid-row: 5;
  color: #62e0b7;
}
.math-equation .result-ones {
  grid-column: 3;
  grid-row: 5;
  color: #62e0b7;
}
.math-equation .result-question {
  grid-column: 3;
  grid-row: 5;
}
.math-equation .crossed {
  text-decoration: line-through;
  text-decoration-color: #ff9b9b;
  text-decoration-thickness: 3px;
}
.card h2:has(.math-equation) {
  display: flex;
  justify-content: center;
  width: 100%;
  white-space: normal;
  line-height: 1;
}

/* v8.15 interactive column arithmetic */
.math-work {
  max-width: 310px;
  margin: 12px auto 6px;
  text-align: center;
}
.math-regroup {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}
.math-columns {
  width: min(100%,270px);
  margin: auto;
}
.math-workspace {
  position: relative;
  display: grid;
  grid-template-columns: 55px 1fr 1fr;
  grid-template-rows: 82px 76px 76px 6px;
  align-items: center;
  justify-items: center;
  font-family: ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric: tabular-nums;
  overflow: visible;
}
.math-digit {
  position: relative;
  font-size: clamp(46px,12vw,67px);
  line-height: 1.1;
}
.math-upper-tens { grid-column: 2; grid-row: 2; }
.math-upper-ones { grid-column: 3; grid-row: 2; }
.math-lower-tens { grid-column: 2; grid-row: 3; }
.math-lower-ones { grid-column: 3; grid-row: 3; }
.math-operator {
  grid-column: 1;
  grid-row: 3;
  font-size: 54px;
}
.math-rule {
  grid-column: 1/4;
  grid-row: 4;
  width: 100%;
  height: 4px;
  background: currentColor;
  border-radius: 4px;
}
.math-annotation {
  grid-row: 1;
  align-self: end;
  font-size: 28px;
  line-height: 1.2;
  color: #5bd6a2;
  font-weight: 750;
  padding-bottom: 5px;
}
.math-annotation.tens { grid-column: 2; }
.math-annotation.ones { grid-column: 3; }
.math-cross::after {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  width: 100%;
  border-top: 4px solid #f16e72;
  transform: rotate(55deg);
}
.math-entry {
  display: grid;
  grid-template-columns: 55px 1fr 1fr;
  gap: 5px;
  margin-top: 12px;
}
.math-entry label {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: #b8c5df;
}
.math-entry label span {
  display: block;
  margin-bottom: 6px;
}
.math-entry input {
  width: 100%;
  min-width: 0;
  text-align: center;
  font-size: 30px;
  padding: 8px 2px;
  height: 65px;
  border-radius: 16px;
}
.math-entry input:focus {
  outline: 2px solid #80b2ff;
  outline-offset: 2px;
}
.math-feedback {
  margin: 16px 0;
  padding: 16px;
}
.math-feedback.good { border-color: #2cae8d; }
.math-feedback.bad { border-color: #c76c89; }

@media(max-width:600px) {
  .shell { padding: 16px 12px 55px; }
  .panel { padding: 16px; }
  .stats { gap: 6px; }
  .stat { padding: 12px 5px; }
  .card { min-height: 265px; padding: 20px; }
  .home-option {
    padding: 15px;
    min-height: 100px;
    gap: 12px;
  }
  .home-option-icon {
    width: 50px;
    height: 50px;
    font-size: 24px;
  }
  .home-option-copy strong { font-size: 19px; }
  .home-option-copy small { font-size: 13px; }
  .how-steps { grid-template-columns: 1fr; }
  .home-help { padding: 17px; }
  .math-workspace {
    grid-template-rows: 82px 70px 70px 6px;
  }
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="logo">
    📚 Study<span>Stack</span>
    <small>v8.15 · Interactive Math Quiz</small>
  </div>
  <div class="row">
    <button class="btn ghost" id="homeBtn">Home</button>
    <button class="btn primary" id="newBtn">+ Create New Deck</button>
  </div>
</header>
<main id="app"></main>
<div class="footnote">
  Your study progress is saved in this browser.
  No account, installation, or subscription required.
</div>
</div>

<script>
(() => {
"use strict";

const KEY = "studystack-v1";
const app = document.getElementById("app");

let db;
try {
  db = JSON.parse(localStorage.getItem(KEY)) || {decks:[]};
} catch {
  db = {decks:[]};
}
if (!Array.isArray(db.decks)) db = {decks:[]};

let current = null;
let mode = "home";
let filter = "unknown";
let idx = 0;
let flip = false;
let shuffle = false;
let order = [];
let quizIndex = 0;
let quizAnswered = false;
let quizSelected = null;
let quizOptions = null;
let learningMode = false;
let learningTaps = 0;
let mathSessionSize = "10";
let mathDigits = {tens:"",ones:""};
let mathRegroup = false;
let mathChecked = null;
let lessonExpanded = false;
let sharedCatalog = [];

const uid = () =>
  Math.random().toString(36).slice(2) +
  Date.now().toString(36);

const esc = value => String(value ?? "").replace(
  /[&<>"']/g,
  c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]
);

function save() {
  try {
    localStorage.setItem(KEY,JSON.stringify(db));
  } catch {
    alert("Browser storage is unavailable or full.");
  }
}
const deck = () => db.decks.find(d => d.id === current);
const set = html => { app.innerHTML = html; };
const btn = (text,action,style="") =>
  `<button class="btn ${style}" data-act="${action}">${text}</button>`;

function makeDeck(name,cards=[]) {
  return {
    id:uid(),
    name:name || "Untitled deck",
    created:Date.now(),
    cards:cards.map(c => ({
      id:uid(),
      q:String(c.q ?? c.front ?? ""),
      a:String(c.a ?? c.back ?? ""),
      known:false
    }))
  };
}
function stats(d) {
  return {
    total:d.cards.length,
    known:d.cards.filter(c => c.known).length,
    unknown:d.cards.filter(c => !c.known).length
  };
}
function mathParts(q) {
  const m = String(q).match(
    /(\d{2})\s*([+\-−])\s*(\d{1,2})/
  );
  if (!m) return null;
  const a = Number(m[1]);
  const b = Number(m[3]);
  const op = m[2] === "+" ? "+" : "−";
  if (op === "−" && b > a) return null;
  return {
    a,b,op,
    result:op === "+" ? a+b : a-b,
    carry:op === "+" && a%10+b%10 >= 10,
    borrow:op === "−" && a%10 < b%10
  };
}
const isMathDeck = d =>
  !!d && d.cards.some(c => mathParts(c.q));
const isGrammarDeck = d =>
  !!d &&
  /grammar|parts of speech|preposition|sentence types/i.test(d.name) &&
  d.cards.length >= 20;
const isSessionDeck = d =>
  isMathDeck(d) || isGrammarDeck(d);

function mathMarkup(q,answer=false) {
  const m = mathParts(q);
  if (!m) return null;
  const n = String(m.result).padStart(2,"0");
  return `<span class="math-equation"
    role="img"
    aria-label="${m.a} ${m.op} ${m.b}">
    ${answer && m.carry ?
      '<span class="carry">1</span>' : ""}
    ${answer && m.borrow ?
      `<span class="borrow-tens">${Math.floor(m.a/10)-1}</span>
       <span class="borrow-ones">${m.a%10+10}</span>` : ""}
    <span class="top-tens ${answer&&m.borrow?"crossed":""}">
      ${Math.floor(m.a/10)}
    </span>
    <span class="top-ones">${m.a%10}</span>
    <span class="plus">${m.op}</span>
    <span class="bottom-tens">
      ${m.b>=10?Math.floor(m.b/10):""}
    </span>
    <span class="bottom-ones">${m.b%10}</span>
    <span class="math-line"></span>
    ${answer ?
      `<span class="result-tens">${n[0]==="0"?"":n[0]}</span>
       <span class="result-ones">${n[1]}</span>` :
      '<span class="result-question">?</span>'}
  </span>`;
}
function grammarQuizParts(c) {
  const lines = String(c.q||"")
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);
  const choices = lines.filter(x=>/^[A-D]\.\s+/.test(x));
  const match = String(c.a||"")
    .match(/^([A-D])\.\s*([^\r\n]*)(?:\r?\n([\s\S]*))?/);
  if (![3,4].includes(choices.length) || !match) return null;
  return {
    prompt:lines.filter(x=>!/^[A-D]\.\s+/.test(x)).join("\n"),
    choices:choices.map(x=>({
      letter:x[0],
      label:x.slice(3).trim()
    })),
    correct:match[1],
    answer:match[2].trim(),
    reason:(match[3]||"").trim()
  };
}
function cardFace(c,answer=false) {
  const math = mathMarkup(c.q,answer);
  if (math) return math;
  let raw = esc(answer?c.a:c.q);
  if (!answer && grammarQuizParts(c)) {
    raw = raw.replace(
      /\[([^\]\n]+)\]/g,
      '<mark class="grammar-highlight">$1</mark>'
    );
  }
  return raw.replace(/\n/g,"<br>");
}
function head(d) {
  return `<div class="row space">
    <div>
      <h1>${esc(d.name)}</h1>
      <span class="muted small">${d.cards.length} cards in master deck</span>
    </div>
    ${btn("← My Decks","myDecks","ghost")}
  </div>`;
}
function home() {
  mode = "home";
  current = null;
  const active = db.decks.filter(d=>!d.hidden);
  set(`<section class="welcome">
    <span class="welcome-eyebrow">WELCOME TO STUDYSTACK</span>
    <h1>What would you like to do?</h1>
    <p class="muted">
      Pick a study guide, practice a few questions,
      and see how much you learn. No account needed.
    </p>
  </section>
  <div class="home-options">
    <button class="home-option" data-act="myDecks">
      <span class="home-option-icon">📚</span>
      <span class="home-option-copy">
        <strong>My Decks</strong>
        <small>Study flashcards you've saved.
          ${active.length} decks ready.</small>
      </span>
      <span class="home-arrow">›</span>
    </button>
    <button class="home-option" data-act="library">
      <span class="home-option-icon">🔎</span>
      <span class="home-option-copy">
        <strong>Browse Shared Decks</strong>
        <small>Find a study guide and add it to My Decks.</small>
      </span>
      <span class="home-arrow">›</span>
    </button>
    <button class="home-option" data-act="new">
      <span class="home-option-icon">＋</span>
      <span class="home-option-copy">
        <strong>Create New Deck</strong>
        <small>Make your own flashcards from scratch.</small>
      </span>
      <span class="home-arrow">›</span>
    </button>
  </div>
  <section class="home-help">
    <h2>How it works</h2>
    <div class="how-steps">
      <div><span>1</span><p><strong>Choose</strong><br>
        Open My Decks or browse the library.</p></div>
      <div><span>2</span><p><strong>Practice</strong><br>
        Study flashcards or take a quiz.</p></div>
      <div><span>3</span><p><strong>Learn</strong><br>
        Mark what you know and keep practicing.</p></div>
    </div>
  </section>
  <div class="home-secondary">
    Already have a deck file?
    ${btn("Import a JSON deck","import","ghost")}
  </div>`);
}
function myDecks() {
  mode = "myDecks";
  current = null;
  const active = db.decks.filter(d=>!d.hidden);
  set(`<div class="row space">
    <div><h1>Your study decks</h1>
    <p class="muted">Learn it. Mark it. Master it.</p></div>
    ${btn("← Home","home","ghost")}
    ${btn("Import deck","import")}

function randomize(arr) {
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pool() {
  const d=deck();
  if (!d) return [];
  return order.filter(id=>d.cards.some(c=>
    c.id===id &&
    (filter==="all" ||
      filter==="known"&&c.known ||
      filter==="unknown"&&!c.known)
  ));
}
function begin(type) {
  const d=deck();
  if (!d) return;
  mode=type;
  idx=0;
  flip=false;
  quizIndex=0;
  quizAnswered=false;
  quizSelected=null;
  quizOptions=null;
  learningMode=false;
  learningTaps=0;
  lessonExpanded=false;
  resetMath();

  const eligible=d.cards.filter(c=>
    filter==="all" ||
    filter==="known"&&c.known ||
    filter==="unknown"&&!c.known
  );

  if(isGrammarDeck(d)&&d.cards.length===100) {
    const count=Number(mathSessionSize);
    const per=Math.floor(count/10);
    const picks=[];
    for(let group=0;group<10;group++) {
      picks.push(...randomize(
        d.cards.slice(group*10,group*10+10)
      ).slice(0,per));
    }
    order=randomize(picks).map(c=>c.id);
    filter="all";
  } else if(isSessionDeck(d)) {
    order=randomize(eligible)
      .slice(0,Number(mathSessionSize))
      .map(c=>c.id);
  } else {
    order=(shuffle?randomize(eligible):eligible).map(c=>c.id);
  }

  if(type==="quiz") renderQuiz();
  else renderStudy();
}
function renderStudy() {
  const d=deck();

  const p=pool();

  const remaining=3-learningTaps;
  const guidance=learningMode ?
    (flip ?
      `Answer revealed. Flip to question to continue.
       ${remaining} practice rounds left.` :
      `Recall the answer, then reveal it.
       ${remaining} practice rounds left.`) :
    (flip ?

  set(`${head(d)}

        text-align:center">
        <strong style="color:#a8c6ff">
          ${learningMode?`📚 Learn it! ${remaining}× remaining`:
            "Flip to reveal the answer"}
        </strong>
        <p class="muted small">${guidance}</p>
      </div>
      <div class="actions">
        <button class="btn bad" data-act="no"
          ${!flip&&!learningMode?"disabled":""}>
          ${learningMode?(flip?"↻ Flip to question":
            `📚 Learn it ${remaining}×`):"✕ Don't Know It"}
        </button>
        <button class="btn good" data-act="yes"
          ${!flip?"disabled":""}>✓ Know It</button>
      </div>
      <div class="row space" style="margin-top:12px">
        ${btn("← Previous","prev","ghost")}
        ${btn("Skip →","next","ghost")}
      </div>

    </div>`);
  const el=document.getElementById("flipCard");
  const toggle=()=>{
    if(learningMode)return;
    flip=!flip;
    renderStudy();
  };
  el.onclick=toggle;
  el.onkeydown=e=>{
    if(e.key==="Enter"||e.key===" ") {
      e.preventDefault();
      toggle();
    }
  };
}
function advance(cardId,known) {
  flip=false;
  learningMode=false;
  learningTaps=0;
  if(!known) {
    order=order.filter(id=>id!==cardId);
    order.push(cardId);
    idx=0;
  } else {
    const p=pool();
    idx=p.length?idx%p.length:0;
  }
  renderStudy();
}
function rate(known) {
  const p=pool();
  const c=deck()?.cards.find(c=>c.id===p[idx]);
  if(!c)return;
  if(known) {
    if(!flip)return;
    c.known=true;
    save();
    advance(c.id,true);
    return;
  }
  if(!learningMode) {
    if(!flip)return;
    learningMode=true;
    learningTaps=0;
    flip=false;
    renderStudy();
    return;
  }
  if(!flip) {
    flip=true;
    renderStudy();
    return;
  }
  flip=false;
  learningTaps++;
  if(learningTaps<3) {
    renderStudy();
    return;
  }
  c.known=false;
  save();
  advance(c.id,false);
}

/* Math quiz — v8.15 */
function resetMath() {
  mathDigits={tens:"",ones:""};
  mathRegroup=false;
  mathChecked=null;
}
function expectedDigits(result) {
  return {
    tens:result>=10?String(Math.floor(result/10)):"",
    ones:String(result%10)
  };
}
function checkMath(m) {
  const expected=expectedDigits(m.result);
  const digitsCorrect=
    mathDigits.tens===expected.tens &&
    mathDigits.ones===expected.ones;
  const regroupNeeded=m.carry||m.borrow;
  return {
    digitsCorrect,
    regroupCorrect:mathRegroup===regroupNeeded,
    correct:digitsCorrect && mathRegroup===regroupNeeded
  };
}
function renderMathQuiz(c,m,p) {
  const d=deck();

  const checked=mathChecked;
  const expected=expectedDigits(m.result);

  const annotation=marked ?
    (m.borrow ?
      `<span class="math-annotation tens">${tens-1}</span>
       <span class="math-annotation ones">${ones+10}</span>` :
      `<span class="math-annotation tens">1</span>`) : "";

  const feedback=quizAnswered ?
    `<div class="panel math-feedback ${checked.correct?"good":"bad"}"
      role="status">
      <h2>${checked.correct?"✓ Correct!":"Review your work"}</h2>
      <p>${m.a} ${m.op} ${m.b} =
        <strong>${m.result}</strong></p>
      <p class="muted small">
        ${m.carry ?
          "Add the ones. Carry 1 ten to the tens column." :
          m.borrow ?
          `Borrow 1 ten: ${tens} becomes ${tens-1},
           and ${ones} becomes ${ones+10}.` :
          "No carrying or borrowing is needed."}
      </p>
      ${!checked.correct ?
        `<p class="muted small">
          ${checked.digitsCorrect ?
            "Your answer digits are correct." :
            `Correct digits: tens ${expected.tens||"blank"},
             ones ${expected.ones}.`}
          ${checked.regroupCorrect ?
            "Your regrouping selection is correct." :
            "Check whether you needed to carry or borrow."}
        </p>` : ""}
    </div>` : "";

  set(`${head(d)}
    <div class="study panel" style="margin-top:20px">
      <span class="pill">
        Math question ${quizIndex+1} of ${p.length}
      </span>
      <p class="muted small">

      </p>
      <div class="math-work">

            class="btn ${marked?"good":""}"
            id="mathRegroup"
            aria-pressed="${marked}"
            ${quizAnswered?"disabled":""}>
            ${m.op==="+" ?
              (marked?"✓ Carry 1":"+¹ Carry 1") :
              (marked?"✓ Borrow":"Borrow a ten")}
          </button>
        </div>
        <div class="math-columns">
          <div class="math-workspace">

              ${tens}
            </div>
            <div class="math-digit math-upper-ones">
              ${ones}
            </div>
            <div class="math-operator">${m.op}</div>
            <div class="math-digit math-lower-tens">
              ${lowerTens||""}
            </div>
            <div class="math-digit math-lower-ones">
              ${lowerOnes}
            </div>
            <div class="math-rule"></div>
          </div>
          <div class="math-entry">
            <div></div>
            <label>
              <span>Tens</span>
              <input id="mathTens"
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="1"
                autocomplete="off"
                aria-label="Tens digit"
                placeholder="?"
                value="${esc(mathDigits.tens)}"
                ${quizAnswered?"disabled":""}>
            </label>
            <label>
              <span>Ones</span>
              <input id="mathOnes"
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="1"

                aria-label="Ones digit"
                placeholder="?"
                value="${esc(mathDigits.ones)}"
                ${quizAnswered?"disabled":""}>
            </label>
          </div>
        </div>
      </div>
      ${feedback}
      <button class="btn primary wide"
        id="mathFlip" style="margin-top:18px">
        ${quizAnswered?"Edit my answer":"Flip to check answer"}
      </button>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="mathClear">Clear answers</button>
      </div>
      <div class="row" style="margin-top:18px">
        ${btn("Know it","qyes","good")}
        ${btn("Don't know","qno","bad")}
        ${btn("Next →","qnext")}
      </div>
    </div>`);

  const tensInput=document.getElementById("mathTens");
  const onesInput=document.getElementById("mathOnes");

  const capture=()=>{
    mathDigits.tens=tensInput.value.replace(/\D/g,"").slice(-1);
    mathDigits.ones=onesInput.value.replace(/\D/g,"").slice(-1);
    tensInput.value=mathDigits.tens;
    onesInput.value=mathDigits.ones;
  };

  tensInput.oninput=()=>{
    capture();
    if(mathDigits.tens)onesInput.focus();
  };
  onesInput.oninput=capture;

  document.getElementById("mathRegroup").onclick=()=>{
    if(quizAnswered)return;

  document.getElementById("mathFlip").onclick=()=>{

      quizSelected=null;
      mathChecked=null;
    }
    renderQuiz();
  };

  document.getElementById("mathClear").onclick=()=>{
    resetMath();
    quizAnswered=false;
    quizSelected=null;
    renderQuiz();
  };
}
function renderQuiz() {
  const d=deck();
  if(!d)return home();
  const p=pool();
  if(!p.length) {
    set(`${head(d)}
      <div class="panel empty">
        <h2>No cards in this stack</h2>
        ${btn("Include all","all")}
      </div>`);
    return;
  }
  quizIndex=Math.min(quizIndex,p.length-1);
  const c=d.cards.find(x=>x.id===p[quizIndex]);
  const arithmetic=mathParts(c.q);
  if(arithmetic) {
    renderMathQuiz(c,arithmetic,p);
    return;
  }

  const grammar=grammarQuizParts(c);
  if(grammar) {
    const prompt=esc(grammar.prompt)
      .replace(/\[([^\]\n]+)\]/g,
        '<mark class="grammar-highlight">$1</mark>')
      .replace(/\n/g,"<br>");
    const options=grammar.choices.map(o=>
      `<button class="btn quizOpt
        ${quizAnswered&&o.letter===grammar.correct?"correct":""}
        ${quizAnswered&&o.letter===quizSelected&&
          o.letter!==grammar.correct?"wrong":""}"
        data-grammar-choice="${o.letter}"
        ${quizAnswered?"disabled":""}>
        ${esc(o.letter+". "+o.label)}
      </button>`).join("");
    set(`${head(d)}
      <div class="study panel" style="margin-top:20px">
        <span class="pill">
          Quiz question ${quizIndex+1} of ${p.length}
        </span>
        <h2 style="margin:25px 0;white-space:normal">
          ${prompt}
        </h2>
        <div>${options}</div>
        ${quizAnswered ?
          `<div class="panel" style="margin:16px 0;padding:16px">
            <strong>
              ${quizSelected===grammar.correct?
                "Correct!":"Not quite."}
              Answer: ${esc(grammar.correct+". "+grammar.answer)}
            </strong>
            <p>${esc(grammar.reason)}</p>
          </div>` : ""}
        <div class="row" style="margin-top:18px">
          ${btn("Know it","qyes","good")}
          ${btn("Don't know","qno","bad")}
          ${btn("Next →","qnext")}
        </div>
      </div>`);
    document.querySelectorAll("[data-grammar-choice]")
      .forEach(b=>{
        b.onclick=()=>{
          if(quizAnswered)return;
          quizAnswered=true;
          quizSelected=b.dataset.grammarChoice;
          renderQuiz();
        };
      });
    return;
  }

  /* General flashcard multiple-choice quiz */
  if(!quizOptions||quizOptions.cardId!==c.id) {
    const distract=randomize(d.cards.filter(x=>
      x.id!==c.id &&
      x.a.trim().toLowerCase()!==c.a.trim().toLowerCase()
    )).slice(0,3);
    quizOptions={
      cardId:c.id,
      ids:randomize([c,...distract]).map(x=>x.id)
    };
  }
  const options=quizOptions.ids
    .map(id=>d.cards.find(x=>x.id===id))
    .filter(Boolean);

  set(`${head(d)}
    <div class="study panel" style="margin-top:20px">
      <span class="pill">
        Quiz question ${quizIndex+1} of ${p.length}
      </span>
      <h2 style="margin:25px 0;white-space:pre-line">
        ${cardFace(c,false)}
      </h2>
      ${options.length>=2 ?
        options.map((o,i)=>`
          <button class="btn quizOpt
            ${quizAnswered&&o.id===c.id?"correct":""}
            ${quizAnswered&&o.id===quizSelected&&
              o.id!==c.id?"wrong":""}"
            data-choice="${esc(o.id)}"
            ${quizAnswered?"disabled":""}>
            ${String.fromCharCode(65+i)}. ${esc(o.a)}
          </button>`).join("") :
        `<button class="btn wide" id="revealAnswer">
          ${quizAnswered?esc(c.a):"Reveal answer"}
        </button>`}
      ${quizAnswered ?
        `<p class="muted">
          ${quizSelected===c.id?"Correct!":
            "Answer: "+esc(c.a)}
        </p>` : ""}
      <div class="row" style="margin-top:18px">
        ${btn("Know it","qyes","good")}
        ${btn("Don't know","qno","bad")}
        ${btn("Next →","qnext")}
      </div>
    </div>`);

  document.querySelectorAll("[data-choice]").forEach(b=>{
    b.onclick=()=>{
      if(quizAnswered)return;
      quizAnswered=true;
      quizSelected=b.dataset.choice;
      renderQuiz();
    };
  });
  const reveal=document.getElementById("revealAnswer");
  if(reveal)reveal.onclick=()=>{
    quizAnswered=true;
    renderQuiz();
  };
}

  if(typeof o==="string")o=JSON.parse(o);
  const cards=Array.isArray(o)?
    o:(o.cards||o.flashcards||o.questions);
  if(!Array.isArray(cards)) {
    throw Error("JSON must contain a cards array.");
  }
  const result=cards.map(c=>({
    q:String(c.q??c.front??c.question??"").trim(),
    a:String(c.a??c.back??c.answer??"").trim()
  })).filter(c=>c.q&&c.a);
  if(!result.length)throw Error("No valid cards found.");
  return {
    name:(!Array.isArray(o)&&String(o.title||o.name||""))||
      "Imported study guide",
    cards:result
  };
}
let importMore=false;
function importScreen(more=false) {
  importMore=more;
  mode="import";
  set(`<h1>${more?"Add cards to this deck":
    "Import flashcards"}</h1>
    <div class="panel" style="max-width:760px">
      <p class="muted">
        Select a JSON file or paste its contents.
      </p>
      <label>Choose JSON file</label>
      <input type="file" id="jsonFile"
        accept=".json,application/json,.txt">
      <label>Or paste JSON</label>
      <textarea id="jsonText" style="min-height:220px"
        placeholder='{"title":"Science","cards":[{"front":"Question?","back":"Answer"}]}'></textarea>
      <div class="row" style="margin-top:15px">
        ${btn("Import cards","doImport","primary")}
        ${btn("Copy ChatGPT prompt","prompt")}
        ${btn("Cancel",more?"deck":"home")}
      </div>
      <p id="importError" style="color:#ff9daf"></p>
    </div>`);
  document.getElementById("jsonFile").onchange=async e=>{
    const f=e.target.files[0];
    if(f)document.getElementById("jsonText").value=await f.text();
  };
}
function doImport() {
  try {
    const n=normalize(document.getElementById("jsonText").value);
    if(importMore&&deck()) {
      deck().cards.push(...n.cards.map(c=>({
        ...c,id:uid(),known:false
      })));
      save();
      edit();
    } else {
      const d=makeDeck(n.name,n.cards);
      db.decks.push(d);
      save();
      open(d.id);
    }
  } catch(e) {
    document.getElementById("importError").textContent=e.message;
  }
}
const promptText =
  "I am uploading photos of a study guide. Read all legible "+
  "content and create comprehensive, accurate flashcards. "+
  "Use short, age-appropriate answers. Return only valid JSON "+
  'in this format: {"title":"Study Guide","cards":'+
  '[{"front":"Question?","back":"Answer"}]}';

function copyPrompt() {
  if(navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(promptText)
      .then(()=>alert("Prompt copied!"))
      .catch(()=>window.prompt("Copy:",promptText));
  } else {
    window.prompt("Copy:",promptText);
  }
}
function slug(s) {
  return s.toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"")
    .slice(0,45)||"study-deck";
}
function download(blob,name) {
  const a=document.createElement("a");
  const u=URL.createObjectURL(blob);
  a.href=u;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function exportJson() {
  const d=deck();
  download(new Blob([
    JSON.stringify({
      title:d.name,
      cards:d.cards.map(c=>({front:c.q,back:c.a}))
    },null,2)
  ],{type:"application/json"}),slug(d.name)+".json");
}
function shareHtml() {
  const d=deck();
  const payload={
    decks:[{
      ...d,
      id:uid(),
      cards:d.cards.map(c=>({
        ...c,id:uid(),known:false
      }))
    }]
  };
  let html=document.documentElement.outerHTML;
  const injection="<script>window.__SHARED_DECK__="+
    JSON.stringify(payload).replace(/</g,"\\u003c")+
    ";<\/script><script>";
  html=html.replace("<script>",injection);
  download(
    new Blob(["<!doctype html>"+html],{type:"text/html"}),
    slug(d.name)+"-flashcards.html"
  );
}
function exportScreen() {
  mode="export";
  const d=deck();
  set(`${head(d)}
    <div class="panel" style="max-width:760px;margin:20px auto">
      <h2>Share this study guide</h2>
      <p class="muted">
        Export the deck as JSON or a standalone HTML study app.
      </p>
      <div class="row">
        ${btn("Download shareable HTML","shareHtml","primary")}
        ${btn("Download JSON backup","exportJson")}
      </div>
      <hr class="divider">
      <p class="muted small">
        The shared file contains questions and answers,
        not your mastery ratings.
      </p>
    </div>`);
}
function reset() {
  if(!confirm("Reset all cards to Don't know?"))return;
  deck().cards.forEach(c=>c.known=false);
  save();
  renderDeck();
}
function del(id) {
  if(!confirm("Delete this flashcard permanently?"))return;
  deck().cards=deck().cards.filter(c=>c.id!==id);
  save();
  edit();
}
function nextQuiz() {
  const p=pool();
  if(!p.length)return renderQuiz();
  quizIndex=(quizIndex+1)%p.length;
  quizAnswered=false;
  quizSelected=null;
  quizOptions=null;
  lessonExpanded=false;
  resetMath();
  renderQuiz();
}
function rateQuiz(known) {
  const p=pool();
  const c=deck()?.cards.find(c=>c.id===p[quizIndex]);
  if(!c)return;
  c.known=known;
  save();
  quizIndex=0;
  quizAnswered=false;
  quizSelected=null;
  quizOptions=null;
  resetMath();
  renderQuiz();
}
function act(a) {
  if(a==="home")return home();
  if(a==="myDecks")return myDecks();
  if(a==="library")return showLibrary();
  if(a==="new")return newDeck();
  if(a==="import")return importScreen(false);
  if(a==="importMore")return importScreen(true);
  if(a==="doImport")return doImport();
  if(a==="prompt")return copyPrompt();
  if(a==="deck")return renderDeck();
  if(a==="study")return begin("study");
  if(a==="quiz")return begin("quiz");
  if(a==="edit")return edit();
  if(a==="add")return cardForm();
  if(a.startsWith("modify:"))return cardForm(a.slice(7));
  if(a.startsWith("delete:"))return del(a.slice(7));
  if(a==="export")return exportScreen();
  if(a==="shareHtml")return shareHtml();
  if(a==="exportJson")return exportJson();
  if(a==="reset")return reset();
  if(a==="yes")return rate(true);
  if(a==="no")return rate(false);
  if(a==="qnext")return nextQuiz();
  if(a==="qyes")return rateQuiz(true);
  if(a==="qno")return rateQuiz(false);

  if(a==="next"||a==="prev") {
    const p=pool();
    if(!p.length)return renderStudy();
    idx=(idx+(a==="next"?1:-1)+p.length)%p.length;
    flip=false;
    learningMode=false;
    learningTaps=0;
    return renderStudy();
  }
  if(a==="all"||a==="unknown") {
    filter=a;
    idx=0;
    flip=false;
    learningMode=false;
    learningTaps=0;
    return begin(mode==="quiz"?"quiz":"study");
  }
}
document.addEventListener("click",e=>{
  const rm=e.target.closest("[data-remove]");
  if(rm) {
    e.preventDefault();
    e.stopPropagation();
    removeDeck(rm.dataset.remove);
    return;
  }
  const pick=e.target.closest("[data-pick]");
  if(pick) {
    e.preventDefault();
    e.stopPropagation();
    addShared(pick.dataset.pick);
    return;
  }
  const b=e.target.closest("[data-act]");
  if(b) {
    e.preventDefault();
    e.stopPropagation();
    if(!b.disabled)act(b.dataset.act);
    return;
  }
  const o=e.target.closest("[data-open]");
  if(o)open(o.dataset.open);
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&
     e.target.matches("[data-open]")) {
    e.preventDefault();
    open(e.target.dataset.open);
  }
});

/* GitHub shared-deck library */
async function fetchCatalog() {
  const response=await fetch(
    "decks/index.json",{cache:"no-store"}
  );
  if(!response.ok) {
    throw Error("Cannot load deck catalog ("+
      response.status+").");
  }
  const data=await response.json();
  if(!Array.isArray(data.decks)) {
    throw Error("Invalid deck catalog.");
  }
  sharedCatalog=data.decks.filter(x=>
    typeof x.file==="string" &&
    /^[-a-zA-Z0-9_]+\.json$/.test(x.file)
  );
  return sharedCatalog;
}
async function showLibrary() {
  mode="library";
  current=null;
  set(`<h1>Shared Deck Library</h1>
    <div class="panel">Loading available decks…</div>`);
  try {
    await fetchCatalog();
    renderLibrary();
  } catch(err) {
    set(`<h1>Shared Deck Library</h1>
      <div class="panel">
        <p>${esc(err.message)}</p>
        ${btn("Try again","library")}
        ${btn("My Decks","myDecks")}
      </div>`);
  }
}
function renderLibrary() {
  mode="library";
  set(`<div class="row space">
    <div>
      <h1>Shared Deck Library</h1>
      <p class="muted">
        ${sharedCatalog.length} available on GitHub.
        Add or remove the decks you want.
      </p>
    </div>
    ${btn("← My Decks","myDecks","ghost")}
    ${btn("Refresh library","library")}
  </div>
  <div class="grid">
    ${sharedCatalog.map(entry=>{
      const d=db.decks.find(x=>x.sharedFile===entry.file);
      const added=!!d&&!d.hidden;
      return `<div class="panel deck">
        <span class="pill">🌐 Shared study guide</span>
        <strong>${esc(entry.title||d?.name||entry.file)}</strong>
        <div class="muted small">
          ${d?d.cards.length+" flashcards · "+
            stats(d).known+" mastered":"Available to add"}
        </div>
        <div class="foot">
          ${added ?
            `<button class="btn danger"
              data-remove="${esc(d.id)}">
              Remove from my decks
            </button>` :
            `<button class="btn primary"
              data-pick="${esc(entry.file)}">
              ${d?"Restore deck":"Add to my decks"}
            </button>`}
        </div>
      </div>`;
    }).join("")||'<div class="panel">No shared decks listed.</div>'}
  </div>`);
}
async function addShared(filename) {
  if(!sharedCatalog.some(e=>e.file===filename))return;
  const existing=db.decks.find(d=>d.sharedFile===filename);
  if(existing) {
    existing.hidden=false;
    save();
    renderLibrary();
    return;
  }
  try {
    const response=await fetch(
      "decks/"+filename,{cache:"no-store"}
    );
    if(!response.ok)throw Error("Deck file unavailable.");
    const parsed=normalize(await response.json());
    const created=makeDeck(parsed.name,parsed.cards);
    created.sharedFile=filename;
    db.decks.push(created);
    save();
    renderLibrary();
  } catch(err) {
    alert("Could not add deck: "+err.message);
  }
}
function removeDeck(id) {
  const d=db.decks.find(x=>x.id===id);
  if(!d)return;
  if(d.sharedFile) {
    if(!confirm('Remove "'+d.name+
      '" from My Decks? Your progress will be saved.'))return;
    d.hidden=true;
  } else {
    if(!confirm('Permanently delete "'+d.name+
      '" and all its cards?'))return;
    db.decks=db.decks.filter(x=>x.id!==id);
  }
  save();
  if(mode==="library")renderLibrary();
  else myDecks();
}
async function loadShared() {
  try {
    const entries=await fetchCatalog();
    let changed=false;
    for(const d of db.decks.filter(x=>x.sharedFile)) {
      if(!entries.some(e=>e.file===d.sharedFile))continue;
      const response=await fetch(
        "decks/"+d.sharedFile,{cache:"no-store"}
      );
      if(!response.ok)continue;
      let parsed;
      try {
        parsed=normalize(await response.json());
      } catch {
        continue;
      }
      const old=new Map(d.cards.map(c=>[
        c.q+"\u0000"+c.a,c
      ]));
      const cards=parsed.cards.map(c=>{
        const prior=old.get(c.q+"\u0000"+c.a);
        return {
          id:prior?.id||uid(),
          q:c.q,a:c.a,
          known:prior?.known||false
        };
      });
      if(JSON.stringify(d.cards)!==JSON.stringify(cards)||
         d.name!==parsed.name) {
        d.cards=cards;
        d.name=parsed.name;
        changed=true;
      }
    }
    if(changed)save();
    if(mode==="home")home();
  } catch {
    /* Offline users can keep studying locally. */
  }
}

/* Import a standalone shared HTML deck if provided. */
if(window.__SHARED_DECK__) {
  let imported=false;
  try {
    imported=sessionStorage.getItem(
      "studystack-shared-imported"
    )==="1";
  } catch {}
  if(!imported) {
    const incoming=window.__SHARED_DECK__.decks||[];
    for(const d of incoming) {
      if(!db.decks.some(x=>
        x.name===d.name &&
        x.cards.length===d.cards.length)) {
        db.decks.push({
          ...d,id:uid(),
          cards:d.cards.map(c=>({
            ...c,id:uid(),known:false
          }))
        });
      }
    }
    save();
    try {
      sessionStorage.setItem(
        "studystack-shared-imported","1"
      );
    } catch {}
  }
}

document.getElementById("homeBtn").onclick=home;
document.getElementById("newBtn").onclick=newDeck;

home();
loadShared();

})();
