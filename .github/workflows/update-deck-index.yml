name: Update StudyStack deck index

on:
  push:
    branches: [main]
    paths:
      - 'decks/*.json'
      - '!decks/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Rebuild decks/index.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          folder = Path('decks')
          decks = []
          for path in sorted(folder.glob('*.json')):
              if path.name == 'index.json':
                  continue
              with path.open(encoding='utf-8') as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  raise ValueError(f'{path}: expected a JSON object')
              title = data.get('title') or data.get('name')
              cards = data.get('cards') or data.get('flashcards') or data.get('questions')
              if not isinstance(title, str) or not title.strip():
                  raise ValueError(f'{path}: missing title')
              if not isinstance(cards, list):
                  raise ValueError(f'{path}: missing cards array')
              decks.append({'title': title.strip(), 'file': path.name})

          index = {'decks': decks}
          (folder / 'index.json').write_text(
              json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(f'Indexed {len(decks)} study guides')
          PY

      - name: Commit updated index if changed
        shell: bash
        run: |
          if git diff --quiet -- decks/index.json; then
            echo 'Deck index already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decks/index.json
          git commit -m 'Automatically update StudyStack deck index'
          git push
